name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app alembic
      - name: Browser UI JavaScript syntax
        run: node --check app/static/app.js
      - name: Unit and API tests
        run: pytest -q
      - name: Migration round-trip
        env:
          SESSIONGRID_DATABASE_URL: sqlite:///./migration_test.db
          SESSIONGRID_AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f migration_test.db
          alembic upgrade head
          alembic downgrade base
          rm -f migration_test.db
